[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-analyze"
version = "0.1.0"
description = "中文 A 股多维研究 Skill 工具"
requires-python = ">=3.9"
dependencies = [
  "pandas>=2.0.0",
  "tushare>=1.4.0",
  "akshare>=1.17.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
stock-analyze = "stock_analyze.cli:main"

[tool.setuptools.packages.find]
include = ["stock_analyze*"]
